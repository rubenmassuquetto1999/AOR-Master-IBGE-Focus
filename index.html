<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      // Prevent TypeError: Cannot set property fetch of #<Window> which has only a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(val) {
              customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Failed to define fetch property:", e);
        }
      })();
    </script>
